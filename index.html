<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ODISHA SIMULATOR: GRAND THEFT AMA GADI (GTA Bhubaneswar 3D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700;800&family=Tiro+Odia:ital@0;1&display=swap" rel="stylesheet">
  <!-- Three.js r128 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-color: #06090d;
      --card-bg: rgba(13, 19, 28, 0.92);
      --card-border: #24364a;
      --text-main: #f0f5fa;
      --text-muted: #8b9fb5;
      --accent-saffron: #ff6d00;
      --accent-gold: #ffd600;
      --accent-turmeric: #ffab00;
      --accent-teal: #00e5ff;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --accent-purple: #b388ff;
      --font-pixel: 'Press Start 2P', monospace;
      --font-ui: 'Space Grotesk', -apple-system, sans-serif;
      --font-odia: 'Tiro Odia', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-ui);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 3px;
      z-index: 10;
      opacity: 0.6;
    }

    .vignette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.75);
      z-index: 11;
    }

    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 8px 12px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 16, 24, 0.90);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-switch-group {
      display: flex;
      gap: 4px;
      background: #090e15;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid #1f2f42;
    }

    .btn-mode {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-mode.active {
      background: #182536;
      color: var(--accent-teal);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
      border: 1px solid var(--accent-teal);
    }

    .header-btns {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-ui {
      background: #141f2d;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }

    .btn-ui:hover {
      border-color: var(--accent-teal);
      color: var(--accent-teal);
    }

    /* ==========================================================================
       GTA BHUBANESWAR HUD (RADAR, WANTED STARS, HEALTH, WEAPON)
       ========================================================================== */
    #gta-ui {
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      pointer-events: none;
    }

    /* GTA Top Right Status (Health, Cash, Wanted Stars) */
    .gta-top-hud {
      align-self: flex-end;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      margin-top: 6px;
    }

    .gta-cash-box {
      font-family: var(--font-pixel);
      font-size: 1.1rem;
      color: var(--accent-green);
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }

    .gta-bars-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 160px;
    }

    .gta-hp-track {
      width: 100%;
      height: 10px;
      background: #000;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }

    .gta-hp-fill {
      height: 100%;
      width: 100%;
      background: #00e676;
    }

    .gta-wanted-stars {
      font-size: 1.1rem;
      color: #333;
      letter-spacing: 2px;
      text-shadow: 1px 1px 0 #000;
    }

    .gta-wanted-stars .active-star {
      color: #ffd600;
      text-shadow: 0 0 8px #ffd600;
    }

    /* GTA Weapon / Vehicle Card */
    .gta-weapon-card {
      background: rgba(14, 21, 30, 0.88);
      border: 1px solid #233549;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom Row (GTA Minimap Radar & Prompt) */
    .gta-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* Circular GTA Radar Minimap */
    .gta-radar-wrap {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #24364a;
      background: rgba(8, 12, 17, 0.92);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      pointer-events: auto;
    }

    #gta-radar-canvas {
      width: 100%;
      height: 100%;
    }

    .gta-location-tag {
      position: absolute;
      bottom: 6px;
      left: 145px;
      background: rgba(10, 16, 24, 0.85);
      border-left: 3px solid var(--accent-gold);
      padding: 4px 10px;
      border-radius: 0 4px 4px 0;
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      color: #fff;
    }

    /* Drive / Steal Interaction Prompt */
    .gta-prompt-box {
      background: rgba(12, 18, 26, 0.92);
      border: 2px solid var(--accent-gold);
      border-radius: 6px;
      padding: 10px 18px;
      text-align: center;
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      color: #fff;
      animation: alertPulse 1.5s infinite alternate;
      max-width: 420px;
      margin: 0 auto 10px;
      pointer-events: auto;
    }

    /* Touch Controls for GTA Mobile */
    .gta-touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      pointer-events: auto;
      max-width: 320px;
    }

    .btn-touch {
      background: rgba(20, 30, 42, 0.9);
      border: 1px solid #36506c;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
    }

    .btn-touch:active {
      background: var(--accent-teal);
      color: #000;
    }

    /* GTA "WASTED" / "DHAMAAK" Screen */
    .gta-wasted-screen {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Space Grotesk', serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #d50000;
      text-shadow: 0 0 30px rgba(213, 0, 0, 0.9), 4px 4px 0 #000;
      letter-spacing: 6px;
      z-index: 200;
      text-align: center;
      pointer-events: none;
    }

    .gta-mission-passed {
      display: none;
      position: absolute;
      top: 38%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 2.4rem;
      color: #ffd600;
      text-shadow: 0 0 25px rgba(255, 214, 0, 0.8), 3px 3px 0 #000;
      z-index: 200;
      text-align: center;
      pointer-events: none;
    }

    /* Other Mode UI Containers */
    #fightkaro-ui, #runner-ui {
      display: none;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .gta-touch-controls { display: grid; }
      .gta-location-tag { display: none; }
      .brand-title { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div id="webgl-canvas"></div>
  <div class="crt-overlay"></div>
  <div class="vignette-overlay"></div>

  <!-- GTA Cinematic Banners -->
  <div class="gta-wasted-screen" id="wastedBanner">
    PHATI GALA<br>
    <span style="font-size: 1.4rem; color: #ff5252;">WASTED (IZZAT KHATAM)</span>
  </div>

  <div class="gta-mission-passed" id="missionPassedBanner">
    KHATTI PASSED!<br>
    <span style="font-size: 1.3rem; color: #00e676;">RESPECT + +</span>
  </div>

  <div id="ui-layer">
    <!-- Header -->
    <header>
      <div class="brand-title">
        <span>⚡</span> GRAND THEFT AMA GADI 3D
      </div>

      <!-- Mode Switcher -->
      <div class="mode-switch-group">
        <button class="btn-mode active" id="btnModeGTA">🚗 GTA OPEN WORLD</button>
        <button class="btn-mode" id="btnModeFight">🥊 FIGHTKARO 1v1</button>
        <button class="btn-mode" id="btnModeRunner">🚌 MO BUS RUSH</button>
      </div>

      <div class="header-btns">
        <button class="btn-ui" id="btnCamToggle">🎥 CAM</button>
        <button class="btn-ui" id="btnSoundToggle"><span id="soundIcon">🔊</span></button>
        <button class="btn-ui" id="btnRestart">🔄 RESET</button>
      </div>
    </header>

    <!-- ======================================================================
         MODE: GTA BHUBANESWAR OPEN-WORLD SANDBOX HUD
         ====================================================================== -->
    <div id="gta-ui">
      <!-- Top Right Status (Rupees, Health, Stars) -->
      <div class="gta-top-hud">
        <div class="gta-cash-box" id="gtaCash">₹00000250</div>
        <div class="gta-bars-box">
          <div class="gta-hp-track">
            <div class="gta-hp-fill" id="gtaHpFill"></div>
          </div>
        </div>
        <div class="gta-wanted-stars" id="gtaStars">
          <span class="star-item">★</span>
          <span class="star-item">★</span>
          <span class="star-item">★</span>
          <span class="star-item">★</span>
          <span class="star-item">★</span>
        </div>
        <div class="gta-weapon-card" id="gtaVehicleCard">
          <span>🧍 ON FOOT</span>
          <span style="color: var(--accent-teal);">[F: ENTER VEHICLE]</span>
        </div>
      </div>

      <!-- Center Action / Prompt Box -->
      <div class="gta-prompt-box" id="gtaPrompt">
        <div>📍 JANPATH CORRIDOR • MASTER CANTEEN</div>
        <div style="font-size: 0.55rem; color: #a4bed4; margin-top: 3px;">
          [WASD] Walk/Drive • [F] Hijack/Drive Gadi • [H] Honk Horn • [Space] Handbrake/Jump
        </div>
      </div>

      <!-- Bottom Row (Radar Minimap & Touch Controls) -->
      <div class="gta-bottom-row">
        <!-- Circular Radar -->
        <div class="gta-radar-wrap">
          <canvas id="gta-radar-canvas" width="130" height="130"></canvas>
        </div>
        <div class="gta-location-tag" id="gtaLocation">
          BHUBANESWAR • CUTTACK TWIN-CITY
        </div>

        <!-- Mobile Touch Controls -->
        <div class="gta-touch-controls">
          <button class="btn-touch" id="tLeft">◀ STEER</button>
          <button class="btn-touch" id="tGas">▲ GAS</button>
          <button class="btn-touch" id="tRight">STEER ▶</button>
          <button class="btn-touch" id="tBrake">▼ BRAKE</button>
          <button class="btn-touch" id="tAction" style="background: var(--accent-saffron); font-weight: bold;">[F] GADI</button>
          <button class="btn-touch" id="tHorn">📯 HORN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       JAVASCRIPT: 3D ENGINE, PROCEDURAL VEHICLES & GTA DRIVING PHYSICS
       ========================================================================== -->
  <script>
    /* ==========================================================================
       1. SYNTHESIZED WEB AUDIO API WITH 3D SPATIAL PANNING
       ========================================================================== */
    class OdishaSpatialAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playVikramHorn() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        [380, 415].forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        });
      }

      playMoBusAirHorn() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        [220, 277, 330].forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        });
      }

      playEngineRev() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.3);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }

      playPoliceSiren() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(950, now + 0.3);
        osc.frequency.linearRampToValueAtTime(600, now + 0.6);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.65);
      }

      playHit() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      playBlip() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    const sound = new OdishaSpatialAudio();

    /* ==========================================================================
       2. THREE.JS 3D SCENE & PROCEDURAL MESH FACTORY
       ========================================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f16);
    scene.fog = new THREE.FogExp2(0x0a0f16, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x111122, 0.65);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.0);
    dirLight.position.set(25, 45, 30);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // City Group (Streets, Buildings, Landmarks)
    const cityGroup = new THREE.Group();
    scene.add(cityGroup);

    // Vehicles Array (Hijackable!)
    const gtaVehicles = [];

    // Procedural Mesh Builders
    const MeshFactory = {
      createVikramAuto() {
        const group = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(2.4, 1.4, 3.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe91e63, roughness: 0.4 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.3;
        body.castShadow = true;
        group.add(body);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.2, 3.9), new THREE.MeshStandardMaterial({ color: 0xffeb3b }));
        roof.position.y = 2.1;
        group.add(roof);

        const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.35, 16);
        const wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        wGeo.rotateZ(Math.PI / 2);
        const w1 = new THREE.Mesh(wGeo, wMat); w1.position.set(0, 0.4, 1.4); group.add(w1);
        const w2 = new THREE.Mesh(wGeo, wMat); w2.position.set(-1.15, 0.4, -1.2); group.add(w2);
        const w3 = new THREE.Mesh(wGeo, wMat); w3.position.set(1.15, 0.4, -1.2); group.add(w3);

        group.userData = {
          name: "Pink Vikram Auto",
          type: "auto",
          speed: 0,
          maxSpeed: 0.42,
          accel: 0.012,
          turnSpeed: 0.038,
          hornSound: () => sound.playVikramHorn()
        };
        return group;
      },

      createMoBus() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 3.0, 10.5), new THREE.MeshStandardMaterial({ color: 0x00c853, roughness: 0.5 }));
        body.position.y = 2.1;
        body.castShadow = true;
        group.add(body);

        const board = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 0.1), new THREE.MeshBasicMaterial({ color: 0x263238 }));
        board.position.set(0, 3.2, 5.3);
        group.add(board);

        group.userData = {
          name: "Mo Bus Route 20",
          type: "bus",
          speed: 0,
          maxSpeed: 0.52,
          accel: 0.008,
          turnSpeed: 0.022,
          hornSound: () => sound.playMoBusAirHorn()
        };
        return group;
      },

      createKTMBike() {
        const group = new THREE.Group();
        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 2.2), new THREE.MeshStandardMaterial({ color: 0xff6d00 }));
        frame.position.y = 0.9;
        group.add(frame);

        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x76ff03, emissive: 0x33aa00 });
        const wGeo = new THREE.TorusGeometry(0.45, 0.12, 10, 24);
        const w1 = new THREE.Mesh(wGeo, wheelMat); w1.position.set(0, 0.5, 1.1); group.add(w1);
        const w2 = new THREE.Mesh(wGeo, wheelMat); w2.position.set(0, 0.5, -1.0); group.add(w2);

        group.userData = {
          name: "Bunty's KTM Duke",
          type: "bike",
          speed: 0,
          maxSpeed: 0.65,
          accel: 0.02,
          turnSpeed: 0.05,
          hornSound: () => sound.playVikramHorn()
        };
        return group;
      },

      createBuilding(w, h, d, color = 0x37474f) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.8 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = h / 2;
        mesh.castShadow = true;
        return mesh;
      },

      createHumanoid(hairColor = 0x212121, shirtColor = 0x00b0ff) {
        const char = new THREE.Group();
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), new THREE.MeshStandardMaterial({ color: 0xd7ccc8 }));
        head.position.y = 2.1;
        char.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.37, 10, 10), new THREE.MeshStandardMaterial({ color: hairColor }));
        hair.position.set(0, 2.22, -0.05);
        char.add(hair);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.45), new THREE.MeshStandardMaterial({ color: shirtColor }));
        torso.position.y = 1.35;
        char.add(torso);

        const legs = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.9, 0.4), new THREE.MeshStandardMaterial({ color: 0x1e272e }));
        legs.position.y = 0.45;
        char.add(legs);
        return char;
      }
    };

    /* ==========================================================================
       3. BUILD GTA BHUBANESWAR 3D MAP & STREETS
       ========================================================================== */
    function buildBhubaneswarCity() {
      // Ground / Roads
      const mainGround = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x161e27, roughness: 0.9 }));
      mainGround.rotation.x = -Math.PI / 2;
      mainGround.receiveShadow = true;
      cityGroup.add(mainGround);

      // Asphalt Janpath Avenue (North-South)
      const road1 = new THREE.Mesh(new THREE.PlaneGeometry(16, 280), new THREE.MeshStandardMaterial({ color: 0x212933, roughness: 0.8 }));
      road1.rotation.x = -Math.PI / 2;
      road1.position.y = 0.02;
      cityGroup.add(road1);

      // Cuttack-Puri Cross Road (East-West)
      const road2 = new THREE.Mesh(new THREE.PlaneGeometry(280, 16), new THREE.MeshStandardMaterial({ color: 0x212933, roughness: 0.8 }));
      road2.rotation.x = -Math.PI / 2;
      road2.position.y = 0.03;
      cityGroup.add(road2);

      // Master Canteen Central Square Roundabout
      const circleGeo = new THREE.CircleGeometry(18, 32);
      const circleMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
      const roundabout = new THREE.Mesh(circleGeo, circleMat);
      roundabout.rotation.x = -Math.PI / 2;
      roundabout.position.y = 0.04;
      cityGroup.add(roundabout);

      // Master Canteen Stone Warrior Horse Monument
      const horsePed = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.5, 7.5), new THREE.MeshStandardMaterial({ color: 0x37474f }));
      horsePed.position.set(0, 1.25, 0);
      cityGroup.add(horsePed);

      const horseBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 4.5), new THREE.MeshStandardMaterial({ color: 0x263238 }));
      horseBody.position.set(0, 3.8, 0);
      cityGroup.add(horseBody);

      // Procedural City Buildings (Patia Apartments, Omfed booth, Commercial Towers)
      const buildings = [
        { x: -30, z: -35, w: 22, h: 25, d: 22, color: 0x2e3d4d },
        { x: 30, z: -35, w: 24, h: 32, d: 22, color: 0x00e676 }, // Neon Green Patia Building
        { x: -30, z: 35, w: 20, h: 18, d: 24, color: 0x3e2723 },
        { x: 30, z: 35, w: 26, h: 22, d: 22, color: 0x1565c0 },
        { x: -45, z: 0, w: 18, h: 14, d: 35, color: 0x455a64 },
        { x: 45, z: 0, w: 18, h: 16, d: 35, color: 0x37474f },
        { x: 0, z: -45, w: 35, h: 18, d: 18, color: 0x263238 }
      ];
      buildings.forEach(b => {
        const mesh = MeshFactory.createBuilding(b.w, b.h, b.d, b.color);
        mesh.position.set(b.x, b.h / 2, b.z);
        cityGroup.add(mesh);
      });

      // Spawn Hijackable Vehicles
      const auto1 = MeshFactory.createVikramAuto();
      auto1.position.set(-5, 0, 15);
      cityGroup.add(auto1);
      gtaVehicles.push(auto1);

      const ktm1 = MeshFactory.createKTMBike();
      ktm1.position.set(6, 0, 12);
      cityGroup.add(ktm1);
      gtaVehicles.push(ktm1);

      const bus1 = MeshFactory.createMoBus();
      bus1.position.set(-5, 0, -25);
      cityGroup.add(bus1);
      gtaVehicles.push(bus1);
    }

    buildBhubaneswarCity();

    /* ==========================================================================
       4. GTA PLAYER, VEHICLE & PHYSICS CONTROLLER
       ========================================================================== */
    const player3D = MeshFactory.createHumanoid(0x212121, 0x00b0ff);
    player3D.position.set(0, 0, 14);
    scene.add(player3D);

    const gtaState = {
      cash: 250,
      hp: 100,
      wantedStars: 1,
      inVehicle: false,
      currentVehicle: null,
      keys: { w: false, s: false, a: false, d: false, space: false },
      playerRot: 0,
      speed: 0,
      maxWalkSpeed: 0.18
    };

    function updateGTAHUD() {
      document.getElementById('gtaCash').innerText = `₹${String(gtaState.cash).padStart(8, '0')}`;
      document.getElementById('gtaHpFill').style.width = `${gtaState.hp}%`;

      const starItems = document.querySelectorAll('.star-item');
      starItems.forEach((s, idx) => {
        if (idx < gtaState.wantedStars) s.className = 'star-item active-star';
        else s.className = 'star-item';
      });

      const card = document.getElementById('gtaVehicleCard');
      if (gtaState.inVehicle) {
        card.innerHTML = `<span>🚗 ${gtaState.currentVehicle.userData.name.toUpperCase()}</span> <span style="color: var(--accent-gold);">[F: EXIT]</span>`;
      } else {
        card.innerHTML = `<span>🧍 ON FOOT</span> <span style="color: var(--accent-teal);">[F: ENTER GADI]</span>`;
      }
    }

    function toggleVehicleEnterExit() {
      if (gtaState.inVehicle) {
        // Exit Vehicle
        const veh = gtaState.currentVehicle;
        gtaState.inVehicle = false;
        gtaState.currentVehicle = null;

        player3D.visible = true;
        player3D.position.set(veh.position.x - 2.5, 0, veh.position.z);
        sound.playBlip();
        document.getElementById('gtaPrompt').innerText = "Exited vehicle. On foot.";
      } else {
        // Find nearest vehicle within 4 units
        let nearest = null;
        let minDist = 4.2;
        gtaVehicles.forEach(v => {
          const d = player3D.position.distanceTo(v.position);
          if (d < minDist) {
            minDist = d;
            nearest = v;
          }
        });

        if (nearest) {
          gtaState.inVehicle = true;
          gtaState.currentVehicle = nearest;
          player3D.visible = false;
          sound.playEngineRev();
          nearest.userData.hornSound();
          document.getElementById('gtaPrompt').innerText = `Driving: ${nearest.userData.name}! [WASD to Drive, H to Honk, F to Exit]`;
        } else {
          document.getElementById('gtaPrompt').innerText = "No vehicle nearby! Walk closer to Pink Vikram, KTM, or Mo Bus.";
        }
      }
      updateGTAHUD();
    }

    /* ==========================================================================
       5. GTA RADAR MINIMAP CANVAS RENDERER
       ========================================================================== */
    const radarCanvas = document.getElementById('gta-radar-canvas');
    const radarCtx = radarCanvas.getContext('2d');

    function drawRadar() {
      radarCtx.clearRect(0, 0, 130, 130);
      const cx = 65, cy = 65;

      // Radar Background & Grid
      radarCtx.fillStyle = '#080d13';
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, 60, 0, Math.PI * 2);
      radarCtx.fill();

      // Range rings
      radarCtx.strokeStyle = '#1e2b38';
      radarCtx.lineWidth = 1;
      radarCtx.beginPath();
      radarCtx.arc(cx, cy, 35, 0, Math.PI * 2);
      radarCtx.arc(cx, cy, 55, 0, Math.PI * 2);
      radarCtx.stroke();

      const pPos = gtaState.inVehicle ? gtaState.currentVehicle.position : player3D.position;

      // Draw Vehicles Blips (Cyan/Pink dots)
      gtaVehicles.forEach(v => {
        const dx = (v.position.x - pPos.x) * 0.9;
        const dy = (v.position.z - pPos.z) * 0.9;
        if (Math.hypot(dx, dy) < 55) {
          radarCtx.fillStyle = '#00e5ff';
          radarCtx.beginPath();
          radarCtx.arc(cx + dx, cy + dy, 3.5, 0, Math.PI * 2);
          radarCtx.fill();
        }
      });

      // Draw Player Arrow at Center
      radarCtx.save();
      radarCtx.translate(cx, cy);
      const rot = gtaState.inVehicle ? gtaState.currentVehicle.rotation.y : gtaState.playerRot;
      radarCtx.rotate(-rot);
      radarCtx.fillStyle = '#ffd600';
      radarCtx.beginPath();
      radarCtx.moveTo(0, -6);
      radarCtx.lineTo(4, 5);
      radarCtx.lineTo(-4, 5);
      radarCtx.closePath();
      radarCtx.fill();
      radarCtx.restore();
    }

    /* ==========================================================================
       6. KEYBOARD & TOUCH EVENT LISTENERS
       ========================================================================== */
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') gtaState.keys.w = true;
      if (k === 's' || k === 'arrowdown') gtaState.keys.s = true;
      if (k === 'a' || k === 'arrowleft') gtaState.keys.a = true;
      if (k === 'd' || k === 'arrowright') gtaState.keys.d = true;
      if (k === 'f' || k === 'enter') toggleVehicleEnterExit();
      if (k === 'h' && gtaState.inVehicle) gtaState.currentVehicle.userData.hornSound();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') gtaState.keys.w = false;
      if (k === 's' || k === 'arrowdown') gtaState.keys.s = false;
      if (k === 'a' || k === 'arrowleft') gtaState.keys.a = false;
      if (k === 'd' || k === 'arrowright') gtaState.keys.d = false;
    });

    // Touch D-Pad
    document.getElementById('tGas').addEventListener('touchstart', () => gtaState.keys.w = true);
    document.getElementById('tGas').addEventListener('touchend', () => gtaState.keys.w = false);
    document.getElementById('tBrake').addEventListener('touchstart', () => gtaState.keys.s = true);
    document.getElementById('tBrake').addEventListener('touchend', () => gtaState.keys.s = false);
    document.getElementById('tLeft').addEventListener('touchstart', () => gtaState.keys.a = true);
    document.getElementById('tLeft').addEventListener('touchend', () => gtaState.keys.a = false);
    document.getElementById('tRight').addEventListener('touchstart', () => gtaState.keys.d = true);
    document.getElementById('tRight').addEventListener('touchend', () => gtaState.keys.d = false);
    document.getElementById('tAction').addEventListener('click', toggleVehicleEnterExit);
    document.getElementById('tHorn').addEventListener('click', () => {
      if (gtaState.inVehicle) gtaState.currentVehicle.userData.hornSound();
    });

    // Header buttons
    document.getElementById('btnRestart').addEventListener('click', () => {
      player3D.position.set(0, 0, 14);
      if (gtaState.inVehicle) toggleVehicleEnterExit();
      gtaState.hp = 100;
      updateGTAHUD();
      sound.playBlip();
    });

    document.getElementById('btnSoundToggle').addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      document.getElementById('soundIcon').innerText = sound.enabled ? '🔊' : '🔇';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ==========================================================================
       7. MAIN 3D ANIMATION LOOP (60 FPS)
       ========================================================================== */
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (gtaState.inVehicle) {
        // VEHICLE DRIVING PHYSICS
        const v = gtaState.currentVehicle;
        const u = v.userData;

        // Acceleration / Reverse
        if (gtaState.keys.w) u.speed = Math.min(u.maxSpeed, u.speed + u.accel);
        else if (gtaState.keys.s) u.speed = Math.max(-u.maxSpeed * 0.4, u.speed - u.accel * 1.5);
        else u.speed *= 0.94; // Friction

        // Steering
        if (Math.abs(u.speed) > 0.01) {
          if (gtaState.keys.a) v.rotation.y += u.turnSpeed * (u.speed > 0 ? 1 : -1);
          if (gtaState.keys.d) v.rotation.y -= u.turnSpeed * (u.speed > 0 ? 1 : -1);
        }

        // Apply Velocity Forward
        v.position.x += Math.sin(v.rotation.y) * u.speed;
        v.position.z += Math.cos(v.rotation.y) * u.speed;

        // Bouncy chassis pitch
        v.rotation.x = THREE.MathUtils.lerp(v.rotation.x, (u.speed / u.maxSpeed) * 0.04, 0.1);

        // Smooth 3rd-person Chase Camera
        const camDist = u.type === 'bus' ? 14 : 9;
        const camHeight = u.type === 'bus' ? 6.5 : 4.2;
        const targetCamX = v.position.x - Math.sin(v.rotation.y) * camDist;
        const targetCamZ = v.position.z - Math.cos(v.rotation.y) * camDist;

        camera.position.x += (targetCamX - camera.position.x) * 0.1;
        camera.position.y += (v.position.y + camHeight - camera.position.y) * 0.1;
        camera.position.z += (targetCamZ - camera.position.z) * 0.1;
        camera.lookAt(v.position.x, v.position.y + 1.2, v.position.z);

      } else {
        // ON-FOOT WALKING PHYSICS
        let moveX = 0, moveZ = 0;
        if (gtaState.keys.w) moveZ -= 1;
        if (gtaState.keys.s) moveZ += 1;
        if (gtaState.keys.a) moveX -= 1;
        if (gtaState.keys.d) moveX += 1;

        if (moveX !== 0 || moveZ !== 0) {
          const angle = Math.atan2(moveX, moveZ);
          gtaState.playerRot = angle + Math.PI;
          player3D.rotation.y = gtaState.playerRot;

          player3D.position.x += Math.sin(angle) * gtaState.maxWalkSpeed;
          player3D.position.z += Math.cos(angle) * gtaState.maxWalkSpeed;

          // Bobbing walk animation
          player3D.position.y = Math.abs(Math.sin(clock.getElapsedTime() * 12)) * 0.12;
        } else {
          player3D.position.y = 0;
        }

        // Camera follow behind player
        camera.position.x += (player3D.position.x - camera.position.x) * 0.08;
        camera.position.y = 5.2;
        camera.position.z += (player3D.position.z + 8.5 - camera.position.z) * 0.08;
        camera.lookAt(player3D.position.x, player3D.position.y + 1.2, player3D.position.z);
      }

      drawRadar();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateGTAHUD();
      animate();
    });
  </script>
</body>
</html>
