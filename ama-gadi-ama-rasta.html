/* ============ basics ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd4e8);
scene.fog = new THREE.Fog(0x9fd4e8, 180, 900);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 2500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);
addEventListener('resize', ()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x8a7a55, .95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.5);
sun.position.set(240, 380, 160);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-400; sun.shadow.camera.right=400;
sun.shadow.camera.top=400; sun.shadow.camera.bottom=-400;
sun.shadow.camera.far=1200; sun.shadow.bias=-0.0006;
scene.add(sun);

const WORLD = 1100, HALF = WORLD/2;
const colliders = []; // {x1,x2,z1,z2}
const mats = {};
function mat(c){ if(!mats[c]) mats[c]=new THREE.MeshLambertMaterial({color:c}); return mats[c]; }
function box(w,h,d,c,x,y,z,ry=0,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  scene.add(m); return m;
}
function addCollider(x,z,w,d){ colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2}); }
function hitsCollider(x,z,r){
  for(const c of colliders) if(x>c.x1-r&&x<c.x2+r&&z>c.z1-r&&z<c.z2+r) return true;
  return false;
}

/* ============ WORLD ============ */
// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, WORLD), mat(0x8fae6a));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// sea (east edge)
const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, WORLD+600, 40, 8),
  new THREE.MeshPhongMaterial({color:0x1d7fa8, shininess:120, specular:0x9fd8ff, flatShading:true}));
sea.rotation.x = -Math.PI/2; sea.position.set(HALF+430, .35, 0); scene.add(sea);
const seaPos = sea.geometry.attributes.position;
// beach strip
const beach = new THREE.Mesh(new THREE.PlaneGeometry(90, WORLD), mat(0xd9c48f));
beach.rotation.x = -Math.PI/2; beach.position.set(HALF-40, .06, 0); beach.receiveShadow=true; scene.add(beach);

// roads: grid every 110, road width 16
const ROAD_GAP = 110, ROAD_W = 16;
function road(x,z,w,d){
  const r = new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat(0x4a4f55));
  r.rotation.x=-Math.PI/2; r.position.set(x,.08,z); r.receiveShadow=true; scene.add(r);
  // dashes
  const along = w>d, len = along?w:d, n = Math.floor(len/24);
  for(let i=0;i<n;i++){
    const off = -len/2 + 12 + i*24;
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(along?7:1.1, along?1.1:7), mat(0xe8e4c9));
    dash.rotation.x=-Math.PI/2; dash.position.set(along?x+off:x, .1, along?z:z+off); scene.add(dash);
  }
}
for(let i=-4;i<=4;i++){ road(i*ROAD_GAP, 0, ROAD_W, WORLD); road(0, i*ROAD_GAP, WORLD, ROAD_W); }

// helper: is a point on a road (used when placing buildings)
const onRoad = (x,z)=>{ for(let i=-4;i<=4;i++){ if(Math.abs(x-i*ROAD_GAP)<ROAD_W/2+4) return true; if(Math.abs(z-i*ROAD_GAP)<ROAD_W/2+4) return true;} return false; };

// city buildings (low-poly), skipping landmark zones
const CITY = [
 // [x, z] block centers offset
];
function building(x,z,w,h,d,c){
  box(w,h,d,c,x,h/2,z); addCollider(x,z,w,d);
  // roof lip
  box(w+2,1.2,d+2, 0x00000022? 0x777777:0x777777, x, h+.6, z);
}
const palette = [0xc9a06a,0xb56b4a,0x9fb8c4,0xd8cf9f,0xa88f6e,0xc47f5e,0x8fa07a,0xd6b98c];
for(let gx=-4;gx<4;gx++) for(let gz=-4;gz<4;gz++){
  const bx = gx*ROAD_GAP + ROAD_GAP/2, bz = gz*ROAD_GAP + ROAD_GAP/2;
  if (bx>330) continue; // leave room for beach/docks on east
  if (Math.abs(bx)<80 && Math.abs(bz)<80) continue; // central plaza
  if (Math.abs(bx-165)<70 && Math.abs(bz+165)<70) continue; // temple zone
  const n = 2 + Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const w = 18+Math.random()*16, d = 18+Math.random()*16, h = 12+Math.random()*30;
    const ox = bx + (Math.random()-.5)*44, oz = bz + (Math.random()-.5)*44;
    if (onRoad(ox,oz)) continue;
    building(ox,oz,w,h,d,palette[Math.floor(Math.random()*palette.length)]);
  }
}

// trees
function tree(x,z){
  box(1.4,5,1.4,0x6b4a2f,x,2.5,z);
  const g = new THREE.Mesh(new THREE.ConeGeometry(4.5,8,7), mat(0x3e7a3a));
  g.position.set(x,8,z); g.castShadow=true; scene.add(g);
}
for(let i=0;i<90;i++){
  const x=(Math.random()-.5)*WORLD, z=(Math.random()-.5)*WORLD;
  if(onRoad(x,z)||x>360) continue;
  if(Math.abs(x)<90&&Math.abs(z)<90) continue;
  tree(x,z);
}

// ---- landmark: Lingaraj-style temple (big shikhara) ----
function temple(x,z,s,c1=0xb5723f,c2=0x8a4f2a){
  const grp = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(34*s,8*s,34*s), mat(0xcbb894)); base.position.y=4*s; grp.add(base);
  let y=8*s;
  for(let i=0;i<6;i++){
    const r = (13-i*1.8)*s;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r*.8, r, 7*s, 8), mat(i%2?c1:c2));
    seg.position.y = y + 3.5*s; seg.castShadow=true; grp.add(seg); y += 6.4*s;
  }
  const amal = new THREE.Mesh(new THREE.SphereGeometry(2.6*s,8,8), mat(0xd9b23f));
  amal.position.y = y + 2*s; grp.add(amal);
  const flag = new THREE.Mesh(new THREE.ConeGeometry(1.6*s,4*s,4), mat(0xe23c3c));
  flag.position.y = y + 6*s; grp.add(flag);
  grp.position.set(x,0,z); scene.add(grp);
  addCollider(x,z,34*s,34*s);
  return grp;
}
temple(165,-165,1.6);                    // "Lingaraj"
temple(-165,165,1.05,0xc98a5a,0xa06038); // "Rajarani"
temple(60,-250,0.9);                     // small neighbourhood temple

(function(){

  cave.position.set(0,5,26); g.add(cave);
  g.position.set(-330,0,-330); scene.add(g);
  addCollider(-330,-330,70,70);
})();

const GARAGE = {x:-55, z:0};
(function(){
  // garage shed
  box(26,10,20,0x8a2f2b,-55,5,-18); addCollider(-55,-18,26,20);

  const f = new THREE.Mesh(new THREE.CylinderGeometry(8,9,2,12), mat(0xbfd6dd));
  f.position.set(20,1,20); f.receiveShadow=true; scene.add(f);
  const w = new THREE.Mesh(new THREE.CylinderGeometry(7,7,.6,12), new THREE.MeshPhongMaterial({color:0x3fb6d8,shininess:140}));
  w.position.set(20,2.1,20); scene.add(w);
  addCollider(20,20,18,18);
})();

// text sign helper (canvas texture)
function sign(x,y,z,text,color="#ffffff",w=512,h=128){

/* ============ AUDIO: original radio + sea air ============ */
let AC=null, radioOn=true, seaGain=null, radioTimer=null;
function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  // sea air: filtered noise, gain scaled by proximity to sea
  const len = AC.sampleRate*2, buf = AC.createBuffer(1,len,AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.6;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  seaGain=AC.createGain(); seaGain.gain.value=0;
  src.connect(lp).connect(seaGain).connect(AC.destination); src.start();
  // original radio tune — "Chilika Breeze" (pentatonic, composed for this game)
  const mel = [0,4,7,9,7,4,2,4, 0,4,7,12,9,7,4,2, 0,-3,0,2,4,2,0,-3, 0,4,2,0,-3,0,2,4];
  const root = 220; let step=0;
  radioTimer = setInterval(()=>{
    if(!AC || !radioOn) return;
    const n = mel[step%mel.length];
    const f = root*Math.pow(2,n/12);
    note(f,.26,'triangle',.045);
    if(step%4===0) note(f/2,.5,'sine',.06);
    if(step%8===4) note(f*1.5,.2,'triangle',.02);
    step++;
  },270);
}
function note(f,dur,type,vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+.05);
}

/* ============ DRIVING PHYSICS ============ */
function driveVehicle(v,dt){
  const wrecked = v.health<=0;
  const gas = keys['w']||keys['arrowup'], brake = keys['s']||keys['arrowdown'];
  const left = keys['a']||keys['arrowleft'], right = keys['d']||keys['arrowright'];
  const hb = keys[' '], boosting = keys['shift'] && v.boost>1 && !wrecked;
  const maxS = v.maxSpeed*(boosting?1.5:1)*(wrecked?0:1);
  if(gas&&!wrecked) v.speed += v.accel*(boosting?2:1)*dt;
  if(brake) v.speed -= v.accel*1.6*dt;
  if(!gas&&!brake) v.speed *= (1-1.2*dt);
  if(hb) v.speed *= (1-4.5*dt);
  v.speed = Math.max(-maxS*.4, Math.min(maxS, v.speed));
  if(boosting) v.boost=Math.max(0,v.boost-32*dt); else v.boost=Math.min(100,v.boost+12*dt);
  const steer = (left?1:0)-(right?1:0);
  const sf = Math.min(1, Math.abs(v.speed)/14)*(hb?2.1:1.25);
  v.heading += steer*sf*dt*2.4*Math.sign(v.speed||1);
  const nx = v.grp.position.x + Math.sin(v.heading)*v.speed*dt;
  const nz = v.grp.position.z + Math.cos(v.heading)*v.speed*dt;
  let hit=false;
  if(hitsCollider(nx,nz,v.radius)) hit=true;
  if(Math.abs(nx)>HALF-24||Math.abs(nz)>HALF-8) hit=true;
  if(hit){
    if(Math.abs(v.speed)>10){ v.health-=Math.abs(v.speed)*.28; flashDamage(); }
    v.speed*=-.25;
  } else { v.grp.position.x=nx; v.grp.position.z=nz; }
  v.grp.rotation.y = v.heading;
  // wrecked → tow
  if(v.health<=0&&v.wreckT===0){ v.wreckT=3; banner(t('tow'),3); }
  if(v.wreckT>0){
    v.wreckT-=dt;
    if(v.wreckT<=0){
      v.grp.position.set(GARAGE.x-15,0,GARAGE.z+20); v.speed=0; v.heading=0;
      v.health=v.hp*.5; S.cash=Math.max(0,S.cash-50); v.wreckT=0;
    }
  }
  // garage repair
  const gd=Math.hypot(v.grp.position.x-GARAGE.x, v.grp.position.z-GARAGE.z);
  if(gd<26&&Math.abs(v.speed)<2&&v.health<v.hp&&S.cash>0){
    v.health=Math.min(v.hp,v.health+10*dt); S.cash=Math.max(0,S.cash-2*dt);
  }
  // traffic collision
  for(const c of traffic){
    const d=Math.hypot(c.grp.position.x-v.grp.position.x, c.grp.position.z-v.grp.position.z);
    if(d<7){ v.health-=14*dt*4; v.speed*=.6; flashDamage(); }
  }
}
let dmgT=0;
function flashDamage(){ dmgT=.25; }
function walkFoot(dt){
  const sp=12*dt;
  let dx=0,dz=0;
  if(keys['w']||keys['arrowup'])dz+=1; if(keys['s']||keys['arrowdown'])dz-=1;
  if(keys['a']||keys['arrowleft'])dx-=1; if(keys['d']||keys['arrowright'])dx+=1;
  if(dx||dz){
    const l=Math.hypot(dx,dz); dx/=l; dz/=l;
    const nx=foot.x+dx*sp, nz=foot.z+dz*sp;
    if(!hitsCollider(nx,nz,1.5)&&Math.abs(nx)<HALF-10&&Math.abs(nz)<HALF-6){ foot.x=nx; foot.z=nz; }
    foot.heading=Math.atan2(dx,dz);
  }
  foot.mesh.position.set(foot.x,0,foot.z);
  foot.mesh.rotation.y=foot.heading;
}

/* ============ ERRAND / SATCHEL LOGIC ============ */
function checkObjectives(){
  const px = S.mode==='drive'? S.vehicle.grp.position.x : foot.x;
  const pz = S.mode==='drive'? S.vehicle.grp.position.z : foot.z;
  if(S.errandIdx<ERRANDS.length){
    const e=ERRANDS[S.errandIdx];
    if(Math.hypot(px-e.x,pz-e.z)<9){
      const bonus = S.mode==='drive'? S.vehicle.pay : 0;
      S.cash += e.pay+bonus;
      banner('✅ +₹'+(e.pay+bonus)+' · '+t('errand')+' '+(S.errandIdx+1)+'/3');
      e.mesh.visible=false; S.errandIdx++;
      if(S.errandIdx<ERRANDS.length) ERRANDS[S.errandIdx].mesh.visible=true;
      if(S.errandIdx>=ERRANDS.length){
        S.satchelReady=true; satchel.mesh.visible=true; satchel.marker.visible=true;
        banner(t('allDone'),4.5);
      }
    }
  } else if(S.satchelReady&&!S.satchelDone){
    if(Math.hypot(px-satchel.x,pz-satchel.z)<9){
      S.satchelDone=true; S.cash+=150;
      satchel.mesh.visible=false; satchel.marker.visible=false;
      banner(t('win')+' (+₹150)',6);
    }
  }
}

/* ============ CAMERA ============ */
const camTarget = new THREE.Vector3();
function updateCamera(dt){
  const v=S.vehicle;
  const px = S.mode==='drive'? v.grp.position.x : foot.x;
  const pz = S.mode==='drive'? v.grp.position.z : foot.z;
  const hd = S.mode==='drive'? v.heading : foot.heading;
  let dist=16,h=7.5,look=6;
  if(S.camMode===1){dist=6.5;h=4;look=10;}
  if(S.camMode===2){dist=1;h=52;look=2;}
  camTarget.set(px-Math.sin(hd)*dist, h, pz-Math.cos(hd)*dist);
  camera.position.lerp(camTarget, Math.min(1, 5*dt));
  camera.lookAt(px+Math.sin(hd)*look, 2.5, pz+Math.cos(hd)*look);
}

/* ============ MAIN LOOP ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const time = clock.elapsedTime;
  if(S.mode==='drive') driveVehicle(S.vehicle,dt); else walkFoot(dt);
  // traffic
  for(const c of traffic){
    c.pos += c.dir*c.speed*dt;
    if(c.pos>HALF) c.pos=-HALF; if(c.pos<-HALF) c.pos=HALF;
    if(c.axis==='x') c.grp.position.x=c.pos; else c.grp.position.z=c.pos;
  }
  // markers bob & spin
  for(const e of ERRANDS) if(e.mesh.visible){ e.mesh.rotation.y=time*1.4; e.mesh.children[0].position.y=9+Math.sin(time*3)*1.2; }
  if(satchel.marker.visible){ satchel.marker.rotation.y=time*1.6; satchel.mesh.rotation.y=time*.8; }
  // sea waves + shimmer
  for(let i=0;i<seaPos.count;i++){ seaPos.setZ(i, Math.sin(time*1.2+i)*0.9); }
  seaPos.needsUpdate=true;
  // sea air volume by distance to sea
  if(seaGain){
    const px = S.mode==='drive'? S.vehicle.grp.position.x : foot.x;
    seaGain.gain.value = Math.max(0, Math.min(.16, (px-150)/2200));
  }
  // damage vignette flash via fog color
  if(dmgT>0){ dmgT-=dt; scene.fog.color.setHex(0xe8a09f); }
  else scene.fog.color.setHex(0x9fd4e8);
  if(S.bannerT>0){ S.bannerT-=dt; if(S.bannerT<=0) document.getElementById('banner').style.display='none'; }
  checkObjectives();
  updateCamera(dt);
  updateHUD();
  drawMap(mmCtx,180);
  if(S.mapOpen) drawMap(bmCtx,520);
  renderer.render(scene,camera);
}

/* ============ START ============ */
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('intro').style.display='none';
  S.started=true;
  initAudio(); if(AC&&AC.state==='suspended')AC.resume();
  banner('🛺 '+objectiveText(),4.5);
});
addEventListener('keydown',e=>{ if(e.key==='Enter'&&!S.started) document.getElementById('startBtn').click(); });
refreshLang();
animate();
</script>
